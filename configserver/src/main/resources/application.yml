server:
  port: 8071

spring:
  application:
    name: configserver
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  cloud:
    config:
      server:
        git:
          uri: https://github.com/sahspeaks/config-repo
          default-label: main
          clone-on-start: true
          timeout: 10
          force-pull: true
        monitor:
          validation-filter-enabled: false

encrypt:
  key: ${ENCRYPT_KEY}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
