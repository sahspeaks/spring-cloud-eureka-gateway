server:
  port: 8072

spring:
  profiles:
    active: default
  application:
    name: gatewayserver

  config:
    import: ${SPRING_CONFIG_IMPORT}

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
    gateway:
      enabled: true
  info:
    env:
      enabled: true


info:
  app:
    name: gatewayserver
    description: Gateway Microservice
    version: 1.0.0